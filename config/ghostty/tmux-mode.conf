# Attach each restored Ghostty surface to its own stable tmux session. Closing
# a tab cleans up its session; quitting Ghostty preserves sessions for restore.
# Comment out config-file = tmux-mode.conf in the main config to disable this.
command = shell:exec "$HOME/.config/ghostty/start-persistent-tmux"

# Do not force zsh injection around the tmux process. Shells created inside
# tmux will load their normal startup files.
shell-integration = detect

# Give Ctrl+S to tmux. A direct binding replaces and removes every
# Ctrl+S-prefixed Ghostty key sequence from the parent configuration.
keybind = ctrl+s=unbind
