# Load the normal interactive tmux configuration first. This file is used as
# tmux's startup configuration when Ghostty creates a new tmux server.
source-file ~/.config/tmux/tmux.conf

# Persist snapshots under ~/.config so they are easy to inspect and back up.
set -g @resurrect-dir "$HOME/.config/tmux/resurrect"

# The default resurrect save binding is prefix + C-s, which conflicts with the
# configured C-s send-prefix binding. Use prefix + S/R for manual save/restore.
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Pane contents are useful context after a reboot, but capturing only the
# visible area avoids archiving each pane's 100,000-line tmux history.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'

# Continuum owns periodic saves. Ghostty's startup wrapper performs restore
# synchronously so concurrently restored tabs cannot create empty sessions
# before resurrect finishes.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'

# Ghostty's macOS application environment does not include Homebrew. Seed the
# plugin processes explicitly; the startup wrapper also adds this directory to
# the tmux server environment without replacing its existing PATH.
run-shell "PATH=/opt/homebrew/bin:/usr/bin:/bin $HOME/.config/tmux/plugins/tmux-resurrect/resurrect.tmux"
run-shell "PATH=/opt/homebrew/bin:/usr/bin:/bin $HOME/.config/tmux/plugins/tmux-continuum/continuum.tmux"

# Reload the complete recovery configuration, not only the base tmux file,
# so prefix + r cannot accidentally remove continuum's status hook.
bind r source-file ~/.config/ghostty/tmux-recovery.conf
